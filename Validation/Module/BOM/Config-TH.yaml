    SAME_SHEET_REFERENCES: []
    CROSS_SHEET_REFERENCES: []

    KDS_REFERENCES:
      - kds_sheet: "SCM_MATNUM"
        kds_columns:
          - "MATNUM_GENERAL_DATA"
        source_columns:
          - "IDNRK_TGT"
        
      - kds_sheet: "THMM_T418"
        kds_columns:
          - "POSTP_TGT"
