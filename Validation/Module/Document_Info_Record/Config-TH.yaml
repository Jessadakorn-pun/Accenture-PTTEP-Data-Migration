MODULE: "Document Info Record"

# ─── File locations (relative to project root) ──────────────────────────────
TEMPLATE_PATH:        "Module/Document_Info_Record/MC2_MNT-PM-M015-DIR_TH Preload v1.0.xlsx"
DATA_STANDARD_PATH:   "Metadata/DataStandard/DataStandardList.xlsx"
DATA_STANDARD_SHEET:  "DIR"
MAPPING_PATH:         "Metadata/Mapping/KDS_DIR.xlsx"
OUTPUT_PATH:          "Output"
OUTPUT_FILE_NAME:     "MC2_MNT-PM-M015-DIR_TH Preload v1.0 Data Cleansing.xlsx"

# ─── Ignore configuration ────────────────────────────────────────────────────
CONFIG_IGNORE_FIELD_SHEET: "Config_Ignore_Field"

IGNORE_COLUMN_SUFFIXES:
  - "_SRC"
  - "_DESC"
  - "SOURCE"
  - "REMARK"

  # ─── Jobs ────────────────────────────────────────────────────────────────────
JOBS:


  - NAME:          "Document Info Record"                 
    SHEET_KEYWORD: "Document Info Record"             
    DS_TABLE:
      - "DRAW"

    VALIDATIONS:
      - mandatory
      - length

    PRIMARY_KEYS:
      - ["DOKAR_TGT", "DOKNR_TGT", "DOKVR_TGT", "DOKTL_TGT"]

    FIXED_VALUE_FIELDS:
      - column: "DTTRG_TGT"
        allowed_values:
          - ""
      
      - column: "DTTRG1_TGT"
        allowed_values:
          - ""
      
      - column: "MRK_DTTRG_TGT"
        allowed_values:
          - ""
      
      - column: "MRK_DTTRG1_TGT"
        allowed_values:
          - ""
      
      - column: "DTTRG_TGT"
        allowed_values:
          - ""
      
    PROHIBITED_NEWLINE_FIELDS: []
    NON_BLANK_OPTIONAL_FIELDS:     [] 
    NON_BLANK_OPTIONAL_ANY_FIELDS: []
    SAME_SHEET_REFERENCES:         []
    CROSS_SHEET_REFERENCES: []
      
    KDS_REFERENCES:
      - kds_sheet: "THMM_TDWP"
        kds_columns:
          - "DAPPL_TGT"
        source_columns:
          - "DAPPL_TGT"
        check_mapping:
          kds_src_columns:
            - "DAPPL_SRC"
          template_src_columns:
            - "DAPPL_SRC"


      - kds_sheet: "THMM_TDWP"
        kds_columns:
          - "DAPPL_TGT"
        source_columns:
          - "DAPPL1_TGT"
        check_mapping:
          kds_src_columns:
            - "DAPPL_SRC"
          template_src_columns:
            - "DAPPL1_SRC"
      

      - kds_sheet: "THMM_TDWA"
        kds_columns:
          - "DOKAR_TGT"
        source_columns:
          - "DOKAR_TGT"
        check_mapping:
          kds_src_columns:
            - "DOKAR_SRC"
          template_src_columns:
            - "DOKAR_SRC"

      
      - kds_sheet: "THMM_TDWS"
        kds_columns:
          - "DOKAR_TGT"
          - "DOKST_TGT"
        source_columns:
          - "DOKAR_TGT"
          - "DOKST_TGT"
        check_mapping:
          kds_src_columns:
            - "DOKAR_SRC"
            - "DOKST_SRC"
          template_src_columns:
            - "DOKAR_SRC"
            - "DOKST_SRC"
      

      - kds_sheet: "THMM_T024L"
        kds_columns:
          - "LABOR_TGT"
