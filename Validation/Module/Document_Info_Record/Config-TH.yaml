          - "LABOR_TGT"
        check_mapping:
          kds_src_columns:
            - "LABOR_SRC"
          template_src_columns:
            - "LABOR_SRC"
      
    
      - kds_sheet: "THMM_TDWA"
        kds_columns:
          - "DOKAR_TGT"
        source_columns:
          - "PREAR_TGT"
        check_mapping:
          kds_src_columns:
            - "DOKAR_SRC"
          template_src_columns:
            - "PREAR_SRC"


      - kds_sheet: "THMM_T001W"
