    SAME_SHEET_REFERENCES:         []
    CROSS_SHEET_REFERENCES: 
      - source_columns:       ["WERKS", "ARBPL"]
        target_sheet_keyword: "DCT213"
        target_columns:       ["WERKS", "ARBPL"]
      
      - source_columns:       ["KTEXT"]
        target_sheet_keyword: "DCT213"
        target_columns:       ["KTEXT"]
      
      - source_columns:       ["KOSTL"]
        target_sheet_keyword: "DCT213"
        target_columns:       ["KOSTL"]
    
    KDS_REFERENCES:
      - kds_sheet: "MY_DCT_Config"
        kds_columns:
          - "VERWE"
        source_columns:
          - "VERWE"
      
      - kds_sheet: "MY_DCT_Config"
        kds_columns:
          - "VGWTS"
        source_columns:
          - "VGWTS"
      
      - kds_sheet: "MY_DCT_Config"
        kds_columns:
          - "FORML"
        source_columns:
          - "FORML"
      
      - kds_sheet: "MY_DCT_Config"
        kds_columns:
          - "PLANV"
