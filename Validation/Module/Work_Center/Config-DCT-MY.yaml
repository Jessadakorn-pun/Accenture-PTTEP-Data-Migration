MODULE: "DCT Work Center"

# ─── File locations (relative to project root) ──────────────────────────────
TEMPLATE_PATH:        "Module/Work_Center/DCT213-214-215.xlsx"   #TODO
DATA_STANDARD_PATH:   "Metadata/DataStandard/DataStandardList.xlsx"
DATA_STANDARD_SHEET:  "DCT Work Center"                          
MAPPING_PATH:         "Metadata/Mapping/KDS_Work_Center.xlsx" #TODO
OUTPUT_PATH:          "Output"
OUTPUT_FILE_NAME:     "DCT213-214-215-Validated.xlsx"       #TODO                         

# ─── Ignore configuration ────────────────────────────────────────────────────
CONFIG_IGNORE_FIELD_SHEET: "Config_Ignore_Field"

IGNORE_COLUMN_SUFFIXES:
  - "_SRC"
  - "_DESC"
  - "SOURCE"
  - "REMARK"
  - "REMARKS"
  - "_DESCRIPTION"

# ─── Jobs (one per worksheet) ────────────────────────────────────────────────
JOBS:
  - NAME:          "1. DCT213"                 
    SHEET_KEYWORD: "DCT213"             
    DS_TABLE:
      - "DCT213"

    VALIDATIONS:
      - mandatory
      - length

    PRIMARY_KEYS:                  
      - ['WERKS', 'ARBPL']

    FIXED_VALUE_FIELDS: []

    PROHIBITED_NEWLINE_FIELDS:
      - "KTEXT"

    NON_BLANK_OPTIONAL_FIELDS:     [] 
    NON_BLANK_OPTIONAL_ANY_FIELDS: []
    SAME_SHEET_REFERENCES:         []
    CROSS_SHEET_REFERENCES: []

    KDS_REFERENCES:
      - kds_sheet: "MY_T001W"
        kds_columns:
          - "WERKS_TGT"
        source_columns:
          - "WERKS"

      - kds_sheet: "MY_KOSTL"
        kds_columns:
          - "KOSTL_TGT"
        source_columns:
          - "KOSTL"

    KDS_PROHIBITED_REFERENCES:     [] 
    CUSTOM_VALIDATIONS: []
  




  - NAME:          "2. DCT214"                 
    SHEET_KEYWORD: "DCT214"             
    DS_TABLE:
      - "DCT214"

    VALIDATIONS:
      - mandatory
      - length

    PRIMARY_KEYS: []

    FIXED_VALUE_FIELDS: []
    PROHIBITED_NEWLINE_FIELDS:
      - "KTEXT"

    NON_BLANK_OPTIONAL_FIELDS:     [] 
    NON_BLANK_OPTIONAL_ANY_FIELDS: []
    SAME_SHEET_REFERENCES:         []
    CROSS_SHEET_REFERENCES: 
      - source_columns:       ["WERKS_TGT", "ARBPL"]
        target_sheet_keyword: "DCT213"
        target_columns:       ["WERKS", "ARBPL"]
      
      - source_columns:       ["KTEXT"]
        target_sheet_keyword: "DCT213"
        target_columns:       ["KTEXT"]

      - source_columns:       ["KOSTL"]
        target_sheet_keyword: "DCT213"
        target_columns:       ["KOSTL"]

    KDS_REFERENCES:
      - kds_sheet: "MY_DCT_Config"
        kds_columns:
          - "WERKS"
        source_columns:
          - "WERKS"

      - kds_sheet: "MY_DCT_Config"
        kds_columns:
          - "WERKS_TGT"
          - "ARBPL"
        source_columns:
          - "WERKS_TGT"
          - "ARBPL"

      - kds_sheet: "MY_KOSTL"
        kds_columns:
          - "KOSTL_TGT"
        source_columns:
          - "KOSTL"
        check_mapping:
          kds_src_columns:         
            - "KOSTL_SRC"
          template_src_columns:      
            - "KOSTL_SRC"

    KDS_PROHIBITED_REFERENCES:     [] 
    CUSTOM_VALIDATIONS: []


    
  
  - NAME:          "3. DCT215"                 
    SHEET_KEYWORD: "DCT215"             
    DS_TABLE:
      - "DCT215"

    VALIDATIONS:
      - mandatory
      - length

    PRIMARY_KEYS:                  
      - ['WERKS', 'ARBPL']

    FIXED_VALUE_FIELDS: []

    PROHIBITED_NEWLINE_FIELDS:
