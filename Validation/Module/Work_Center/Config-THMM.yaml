  - NAME:          "3. Assignment of Work Center to Cost Center"                 
    SHEET_KEYWORD: "PMWORKCENTER_CRCO_T_RPT_TH"             
    DS_TABLE:
      - "CRCO"

    VALIDATIONS:
      - mandatory
      - length

    PRIMARY_KEYS:                  
      - ["WERKS", "ARBPL", "LASET_TGT", "ENDDA_TGT", "LANUM_TGT"]

    FIXED_VALUE_FIELDS:     [] 
    PROHIBITED_NEWLINE_FIELDS:     [] 
    NON_BLANK_OPTIONAL_FIELDS:     [] 
    NON_BLANK_OPTIONAL_ANY_FIELDS: []
    SAME_SHEET_REFERENCES:         []

    CROSS_SHEET_REFERENCES: 
      # Check Parent-Child in Working Center Header Sheet (Plant + Work Center)
      - source_columns:       ["WERKS", "ARBPL"]
        target_sheet_keyword: "PMWORKCENTER_CRHD_T_RPT_TH"
        target_columns:       ["WERKS_TGT", "ARBPL_TGT"]
        
    KDS_REFERENCES:
      # Formula key for costing
      - kds_sheet: "THMM_TC25"
        kds_columns:
          - "FORT1_TGT"
        source_columns:
          - "FORML_TGT"
        check_mapping:
          kds_src_columns:         
            - "FORT1_SRC"
          template_src_columns:      
            - "FORML_SRC"

      # Cost Center
      - kds_sheet: "THMM_KOSTL"
        kds_columns:
          - "KOSTL_TGT"
        source_columns:
          - "KOSTL_TGT"
        check_mapping:
          kds_src_columns:         
            - "KOSTL_SRC"
          template_src_columns:      
            - "KOSTL_SRC"
      
      # THMM - Activity Type
      - kds_sheet: "THMM_ActType"
        kds_columns:
          - "LSTAR_TGT"
        source_columns:
          - "LSTAR_TGT"
        check_mapping:
          kds_src_columns:         
            - "LSTAR_SRC"
          template_src_columns:      
            - "LSTAR_SRC"

    KDS_PROHIBITED_REFERENCES:     [] 

    # START_WITH_FIELDS:
    #   # For Plant 1001 (Arti Plant) cost center have to start with "P"
    #   - column: "KOSTL_TGT"
    #     prefix:
    #       - "P"
    #     condition:
    #       column: "WERKS"
    #       values: ["1001"]

    CUSTOM_VALIDATIONS:
      # Check BEGDA ENDDA format YYYYMMDD
      - check_ad_date:
          - "BEGDA_TGT"     
          - "ENDDA_TGT"
      # Check valid start / end date
      - check_between_time:
        - start_date: "BEGDA_TGT"
          end_date:   "ENDDA_TGT"
  






  - NAME:          "3. Assignment of Work Center to Cost Center - 1001"                 
    SHEET_KEYWORD: "CRCO_1001"             
    DS_TABLE:
      - "CRCO"

    VALIDATIONS:
