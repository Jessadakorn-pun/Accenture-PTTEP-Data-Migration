MODULE: "Work Center THMM"

# ─── File locations (relative to project root) ──────────────────────────────
TEMPLATE_PATH:        "Module/Work_Center/MC2_MNT-PM-M005_PM Work Center_THMM_Preload_V2.xlsx" 
DATA_STANDARD_PATH:   "Metadata/DataStandard/DataStandardList.xlsx"
DATA_STANDARD_SHEET:  "Work Center"                          
MAPPING_PATH:         "Metadata/Mapping/KDS_ALL_MAPPING.xlsx"
OUTPUT_PATH:          "Output"
OUTPUT_FILE_NAME:     "MC2_MNT-PM-M005_PM Work Center_THMM_Preload_V2 Data Cleansing.xlsx"                      

# ─── Ignore configuration ────────────────────────────────────────────────────
CONFIG_IGNORE_FIELD_SHEET: "Config_Ignore_Field"

IGNORE_COLUMN_SUFFIXES:
  - "_SRC"
  - "_DESC"
  - "SOURCE"
  - "REMARK"
  - "REMARKS"
  - "_DESCRIPTION"

# ─── Jobs (one per worksheet) ────────────────────────────────────────────────
JOBS:
  - NAME:          "1. Work Center Header"                 
    SHEET_KEYWORD: "PMWORKCENTER_CRHD_T_RPT_TH"             
    DS_TABLE:
      - "CRHD" 

    VALIDATIONS:
      - mandatory
      - length

    PRIMARY_KEYS:                  
      - ["OBJTY_TGT", "OBJID_TGT", "WERKS_TGT", "ARBPL_TGT"]

    FIXED_VALUE_FIELDS:
      # Only include active plants listed in the 'RR_TH_Active Plants' tab 
      #(refer to the PM Work Center Data Standard)
      - column: "WERKS_SRC"
        allowed_values:
          - "1201"
          - "1202"
          - "1602"
          - "1603"
          - "1604"
          - "1605"
          - "2101"
          - "2301"
          - "2801"
          - "4101"
          - "5101"
          - "5301"
          - "5302"
          - "5303"
          - "8401"
          - "MY01"
          - "MY02"
          - "MY05"
          - "MY06"
          - "MY07"
          - "2901"
          - "1401"
      
      # Control Key (STEUS) Default: PM01
      - column: "STEUS_TGT"
        allowed_values:
          - "PM01"

    PROHIBITED_NEWLINE_FIELDS:     [] 

    NON_BLANK_OPTIONAL_FIELDS:
      # Check Nonbalnk for Work Center column
      - "ARBPL_TGT"

    NON_BLANK_OPTIONAL_ANY_FIELDS: []
    SAME_SHEET_REFERENCES:         []
    CROSS_SHEET_REFERENCES:        []

    KDS_REFERENCES:
      # Plant
      - kds_sheet: "THMM_T001W"
        kds_columns:
          - "WERKS_TGT"
        source_columns:
          - "WERKS_TGT"
        check_mapping:
          kds_src_columns:         
            - "WERKS_SRC"
          template_src_columns:      
            - "WERKS_SRC"

      # Work Center Category
      - kds_sheet: "THMM_TC30"
        kds_columns:
          - "VERWE_TGT"
        source_columns:
          - "VERWE_TGT"
        check_mapping:
          kds_src_columns:         
            - "VERWE_SRC"
          template_src_columns:      
            - "VERWE_SRC"

      # Formula for set up time
      - kds_sheet: "THMM_TC23"
        kds_columns:
          - "PLANV_TGT"
        source_columns:
          - "PLANV_TGT"
        check_mapping:
          kds_src_columns:         
            - "PLANV_SRC"
          template_src_columns:      
            - "PLANV_SRC"
      
      # Standard Value Key
      - kds_sheet: "THMM_TC21"
        kds_columns:
          - "VGWTS_TGT"
        source_columns:
          - "VGWTS_TGT"
        check_mapping:
          kds_src_columns:         
            - "VGWTS_SRC"
          template_src_columns:      
            - "VGWTS_SRC"

       # Formula for setup time
      - kds_sheet: "THMM_TC25"
        kds_columns:
          - "FORT1_TGT"
        source_columns:
          - "FORT1_TGT"
        check_mapping:
          kds_src_columns:         
            - "FORT1_SRC"
          template_src_columns:      
            - "FORT1_SRC"
      
      # Formula for the duration of processing time
      - kds_sheet: "THMM_TC25"
        kds_columns:
          - "FORT1_TGT"
        source_columns:
          - "FORT2_TGT"
        check_mapping:
          kds_src_columns:         
            - "FORT1_SRC"
          template_src_columns:      
            - "FORT2_SRC"

      # Formula for teardown time
      - kds_sheet: "THMM_TC25"
        kds_columns:
          - "FORT1_TGT"
        source_columns:
          - "FORT3_TGT"
        check_mapping:
          kds_src_columns:         
            - "FORT1_SRC"
          template_src_columns:      
            - "FORT3_SRC"
      # Formula for the duration of other types of int. processing
      - kds_sheet: "THMM_TC25"
        kds_columns:
          - "FORT1_TGT"
        source_columns:
          - "FORTN_TGT"
        check_mapping:
          kds_src_columns:         
            - "FORT1_SRC"
          template_src_columns:      
            - "FORTN_SRC"

    
    KDS_PROHIBITED_REFERENCES:
      # Exclude work centers listed in the 'RR_TH_Deleted WC' tab (refer to the PM Work Center Data Standard), 
      # using the Plant and Work Center combination as the reference key
      - kds_sheet: "THMM_WERK_ARBPL_EXC"
        kds_columns:
          - "WERKS_SRC"
          - "ARBPL_SRC"
        source_columns:
          - "WERKS_SRC"
          - "ARBPL_SRC"

    CUSTOM_VALIDATIONS:
      # Check BEGDA date format YYYYMMDD
      - check_ad_date:
        - BEGDA_TGT  
  














