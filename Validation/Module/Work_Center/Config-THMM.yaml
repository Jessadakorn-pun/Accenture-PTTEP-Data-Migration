        check_mapping:
          kds_src_columns:         
            - "LSTAR_SRC"
          template_src_columns:      
            - "LSTAR_SRC"

    KDS_PROHIBITED_REFERENCES:     [] 

    START_WITH_FIELDS:
      # For Plant 1001 (Arti Plant) cost center have to start with "P"
      - column: "KOSTL_TGT"
        prefix:
          - "P"
        condition:
          column: "WERKS"
          values: ["1001"]

    CUSTOM_VALIDATIONS:
      # Check BEGDA ENDDA format YYYYMMDD
      - check_ad_date:
          - "BEGDA_TGT"     
          - "ENDDA_TGT"
      # Check valid start / end date
      - check_between_time:
        - start_date: "BEGDA_TGT"
          end_date:   "ENDDA_TGT"

      - check_group_consistency:
        - group_by:
            - WERKS
            - ZLEGACYLANUM
            - ARBPL
          sort_by:
            - WERKS
            - ZLEGACYLANUM
            - ARBPL
          check_columns:
            - OBJTY_TGT
            - OBJID_TGT
            - ENDDA_TGT
            - BEGDA_TGT
            - KOSTL_TGT
            # - LSTAR_TGT # ไม่มีใน template เเต่มีใน DCFS
            # - LASET_TGT # ไม่มีใน template เเต่มีใน DCFS
            - FORML_TGT
          condition:
            column: "WERKS"
            values: ["1001", "1014"]  
  

 





  
