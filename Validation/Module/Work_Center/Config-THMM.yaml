        target_sheet_keyword: "PMWORKCENTER_CRHD_T_RPT_TH"
        target_columns:       ["WERKS_TGT", "ARBPL_TGT"]
        
    KDS_REFERENCES:
      # Formula key for costing
      - kds_sheet: "THMM_TC25"
        kds_columns:
          - "FORT1_TGT"
        source_columns:
          - "FORML_TGT"
        check_mapping:
          kds_src_columns:         
            - "FORT1_SRC"
          template_src_columns:      
            - "FORML_SRC"

      # Cost Center
      - kds_sheet: "THMM_KOSTL"
        kds_columns:
          - "KOSTL_TGT"
        source_columns:
          - "KOSTL_TGT"
        check_mapping:
          kds_src_columns:         
            - "KOSTL_SRC"
          template_src_columns:      
            - "KOSTL_SRC"
      
      # THMM - Activity Type
      - kds_sheet: "THMM_ActType"
        kds_columns:
