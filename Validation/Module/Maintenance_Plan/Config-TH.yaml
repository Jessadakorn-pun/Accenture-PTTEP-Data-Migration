MODULE: "Functional Location"

# ─── File locations (relative to project root) ──────────────────────────────
TEMPLATE_PATH:        "Module/Maintenance_Plan/MC2_MNT-PM-M014_Maintenance_Plan_&_Item_TH_Preload V2.xlsx"
DATA_STANDARD_PATH:   "Metadata/DataStandard/DataStandardList.xlsx"
DATA_STANDARD_SHEET:  "Maintenance Plan"
MAPPING_PATH:         "Metadata/Mapping/KDS_Maintenance_Plan.xlsx"
OUTPUT_PATH:          "Output"
OUTPUT_FILE_NAME:     "MC2_MNT-PM-M014_Maintenance_Plan_&_Item_TH_Preload V2 Data Cleasing 2.xlsx"

# ─── Ignore configuration ────────────────────────────────────────────────────
CONFIG_IGNORE_FIELD_SHEET: "Config_Ignore_Field"

IGNORE_COLUMN_SUFFIXES:
  - "_SRC"
  - "_DESC"
  - "SOURCE"
  - "REMARK"

  # ─── Jobs ────────────────────────────────────────────────────────────────────
JOBS:


  - NAME:          "Maintenance Plan"                 
    SHEET_KEYWORD: "Maintenance Plan"             
    DS_TABLE:
      - "MPLA"
      - "MMPT"

    VALIDATIONS:
      - mandatory
      - length

    PRIMARY_KEYS:
      - ["Maintenance Plan_TGT", "Maintenance Plan Category_TGT"]

    FIXED_VALUE_FIELDS:
      - column: "Calculation Type of Call Horizon_TGT"
        allowed_values:
          - "%"
      
    PROHIBITED_NEWLINE_FIELDS: []
    NON_BLANK_OPTIONAL_FIELDS:     [] 
    NON_BLANK_OPTIONAL_ANY_FIELDS: []
    SAME_SHEET_REFERENCES:         []
    CROSS_SHEET_REFERENCES:
      - source_columns:       ["Maintenance Strategy_TGT"]
        target_sheet_keyword: "Maintenance Strategy"
        target_columns:       ["Name_TGT"]
      
    KDS_REFERENCES:
      - kds_sheet: "THMM_T399W"
        kds_columns:
          - "MPTYP_TGT"
        source_columns:
          - "Maintenance Plan Category_TGT"
        check_mapping:
          kds_src_columns:
            - "MPTYP_SRC"
          template_src_columns:
            - "Maintenance Plan Category_SRC"

    KDS_PROHIBITED_REFERENCES: []
    KDS_COMPLETENESS_REFERENCES: []
    START_WITH_FIELDS: []
    CUSTOM_VALIDATIONS: [] 


















