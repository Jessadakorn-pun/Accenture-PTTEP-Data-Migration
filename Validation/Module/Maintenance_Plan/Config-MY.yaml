    CUSTOM_VALIDATIONS:     [] 





















  - NAME:          "Long Text Maintenance Item"                 
    SHEET_KEYWORD: "Long Text Maintenance Item"             
    DS_TABLE:
      - "STXH"
      - "STXL"

    VALIDATIONS:
      - mandatory
      - length

    PRIMARY_KEYS: []
    FIXED_VALUE_FIELDS: []
    PROHIBITED_NEWLINE_FIELDS: []
    NON_BLANK_OPTIONAL_FIELDS:     [] 
    NON_BLANK_OPTIONAL_ANY_FIELDS: []
    SAME_SHEET_REFERENCES:         []

    CROSS_SHEET_REFERENCES:
      - source_columns:       ["Maintenance_Plan"]
        target_sheet_keyword: "Maintenance Plan"
        target_columns:       ["Maintenance Plan_TGT"] 

    KDS_REFERENCES: []
    KDS_PROHIBITED_REFERENCES: []
    KDS_COMPLETENESS_REFERENCES: []
    CUSTOM_VALIDATIONS:     [] 
  