  - NAME:          "DCT_EQ_Attributes"                 
    SHEET_KEYWORD: "DCT_EQ_Attributes"             
    DS_TABLE:
      - "DCT206"
    VALIDATIONS: []

    PRIMARY_KEYS:                  
      - ["EQUNR"]

    FIXED_VALUE_FIELDS: []
    PROHIBITED_NEWLINE_FIELDS: []
    NON_BLANK_OPTIONAL_FIELDS:
      - column: "STORT"
        condition:
          column: "EQTYP"
          values: ["C", "G", "M", "P", "Q", "S"]
      
      - column: "PROID"
        condition:
          column: "EQTYP"
          values: ["C", "G", "M", "P", "Q", "S"]

    
    NON_BLANK_OPTIONAL_ANY_FIELDS: []
    SAME_SHEET_REFERENCES: []
    CROSS_SHEET_REFERENCES: []
    KDS_REFERENCES:
      - kds_sheet: "DCT205"
        kds_columns:
          - "SWERK_STORT"
          - "STORT"
        source_columns:
          - "SWERK_TGT"
          - "STORT"
      
      - kds_sheet: "DCT205"
        kds_columns:
          - "SWERK_BEBER"
          - "BEBER"
        source_columns:
          - "SWERK_TGT"
          - "BEBER"
      
      - kds_sheet: "CC_TO_WBS"
        kds_columns:
          - "PROID_TGT"
        source_columns:
          - "PROID"

