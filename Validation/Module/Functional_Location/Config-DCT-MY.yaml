MODULE: "Functional Location"

# ─── File locations (relative to project root) ──────────────────────────────
TEMPLATE_PATH:        "Module/Functional_Location/DCT-MY-4.xlsx"
DATA_STANDARD_PATH:   "Metadata/DataStandard/DataStandardList.xlsx"
DATA_STANDARD_SHEET:  "Functional Location DCT"
MAPPING_PATH:         "Metadata/Mapping/KDS_FLOC_EQ.xlsx"
OUTPUT_PATH:          "Output"
OUTPUT_FILE_NAME:     "DCT-MY-Validated-201-202-203-204 V4.xlsx"

# ─── Ignore configuration ────────────────────────────────────────────────────
CONFIG_IGNORE_FIELD_SHEET: "Config_Ignore_Field"

IGNORE_COLUMN_SUFFIXES:
  - "_SRC"
  - "_DESC"
  - "SOURCE"
  - "REMARK"

  # ─── Jobs ────────────────────────────────────────────────────────────────────
JOBS:
  
  - NAME:          "DCT_MY_FL_EQ_Hierarchy"                 
    SHEET_KEYWORD: "DCT_MY_FL_EQ_Hierarchy"             
    DS_TABLE:
      - "DCT201"

    VALIDATIONS:
      - mandatory
      - length

    PRIMARY_KEYS:                  
      - ["Structure Type", "Structure"]

    FIXED_VALUE_FIELDS:   []
    PROHIBITED_NEWLINE_FIELDS: []
    NON_BLANK_OPTIONAL_FIELDS:     [] 
    NON_BLANK_OPTIONAL_ANY_FIELDS: []

    SAME_SHEET_REFERENCES:
      - source_column: "Parent"    
        target_column: "Structure"

    CROSS_SHEET_REFERENCES: []
    KDS_REFERENCES: []
    KDS_PROHIBITED_REFERENCES: []
    KDS_COMPLETENESS_REFERENCES: []
    CUSTOM_VALIDATIONS:     [] 
  













  - NAME:          "DCT_MY_Asset Assignment"                 
    SHEET_KEYWORD: "DCT_MY_Asset Assignment"             
    DS_TABLE:
      - "DCT202"

    VALIDATIONS:
      - mandatory
      - length

    PRIMARY_KEYS: []
    FIXED_VALUE_FIELDS: []
    PROHIBITED_NEWLINE_FIELDS: []
    NON_BLANK_OPTIONAL_FIELDS:     [] 
    NON_BLANK_OPTIONAL_ANY_FIELDS: []

    SAME_SHEET_REFERENCES: []

    CROSS_SHEET_REFERENCES: 
      - source_columns:       ["To-Be Structure"]
        target_sheet_keyword: "DCT_MY_FL_EQ_Hierarchy"
        target_columns:       ["Structure"]
      
      - source_columns:       ["To-Be Structure Description"]
        target_sheet_keyword: "DCT_MY_FL_EQ_Hierarchy"
        target_columns:       ["Structure Description"]
      
      - source_columns:       ["To-Be Parent"]
        target_sheet_keyword: "DCT_MY_FL_EQ_Hierarchy"
        target_columns:       ["Structure"]
      
      - source_columns:       ["To-Be Parent Description"]
        target_sheet_keyword: "DCT_MY_FL_EQ_Hierarchy"
        target_columns:       ["Structure Description"]

    KDS_REFERENCES:     [] 
    KDS_PROHIBITED_REFERENCES: []
    KDS_COMPLETENESS_REFERENCES: []
    CUSTOM_VALIDATIONS:     [] 

  
  








  - NAME:          "DCT_FL_Attributes"                 
    SHEET_KEYWORD: "DCT_FL_Attributes"             
    DS_TABLE:
      - "DCT203"

    VALIDATIONS:
      - mandatory
      - length

    PRIMARY_KEYS: 
      - ["TPLNR"]

    FIXED_VALUE_FIELDS:
      - column: "TPLKZ"
        allowed_values:
          - "PTTEP"

    PROHIBITED_NEWLINE_FIELDS: []
    NON_BLANK_OPTIONAL_FIELDS:
      
      - column: "STORT"
        condition:
          column: "FLTYP"
          values: ["5", "6", "7", "8"]
      
      - column: "BEBER"
        condition:
          column: "FLTYP"
          values: ["3", "4", "5", "6", "7", "8", "9"]
          
      - column: "IWERK"
        condition:
          column: "FLTYP"
          values: ["3", "4", "5", "6", "7", "8", "9"]
      
      - column: "SWERK"
        condition:
          column: "FLTYP"
          values: ["3", "4", "5", "6", "7", "8", "9"]

      - column: "PROID"
        condition:
          column: "FLTYP"
          values: ["5", "6", "7", "8", "9"]
          
    NON_BLANK_OPTIONAL_ANY_FIELDS: []

    SAME_SHEET_REFERENCES: []

    CROSS_SHEET_REFERENCES: 
      - source_columns:       ["TPLNR"]
        target_sheet_keyword: "DCT_MY_FL_EQ_Hierarchy"
        target_columns:       ["Structure"]
      
      - source_columns:       ["PLTXT"]
        target_sheet_keyword: "DCT_MY_FL_EQ_Hierarchy"
        target_columns:       ["Structure Description"]

    KDS_REFERENCES:
      - kds_sheet: "DCT203"
        kds_columns:
          - "FLTYP"
        source_columns:
          - "FLTYP"

      - kds_sheet: "DCT203"
        kds_columns:
          - "STAT"
        source_columns:
          - "STAT"
      
      - kds_sheet: "DCT203"
        kds_columns:
          - "SWERK"
        source_columns:
          - "SWERK"
      
      - kds_sheet: "DCT203"
        kds_columns:
          - "ABCKZ"
        source_columns:
          - "ABCKZ"
      
      - kds_sheet: "DCT203"
        kds_columns:
          - "IWERK"
        source_columns:
          - "IWERK"

      - kds_sheet: "DCT203"
        kds_columns:
          - "SWERK_STORT"
          - "STORT"
        source_columns:
          - "SWERK"
          - "STORT"

      - kds_sheet: "DCT204"
        kds_columns:
          - "SWERK_BEBER"
          - "BEBER"
        source_columns:
          - "SWERK"
          - "BEBER"
      
      - kds_sheet: "DCT203"
        kds_columns:
          - "INGRP"
        source_columns:
          - "INGRP"

      - kds_sheet: "DCT203"
        kds_columns:
          - "BUKRS"
        source_columns:
          - "BUKRS"

      - kds_sheet: "DCT203"
        kds_columns:
          - "RBNR"
        source_columns:
          - "RBNR"
      
      - kds_sheet: "CC_TO_WBS"
        kds_columns:
          - "PROID_TGT"
        source_columns:
          - "PROID"
      
      - kds_sheet: "MY_KOSTL"
        kds_columns:
          - "KOSTL_TGT"
        source_columns:
          - "KOSTL"


    KDS_COMPLETENESS_REFERENCES:
      - kds_sheet:      "DCT201-FL"
        kds_field_name: "TPLNR_DCT"       
        source_column:  "TPLNR"
        
    CUSTOM_VALIDATIONS:     [] 

  






















