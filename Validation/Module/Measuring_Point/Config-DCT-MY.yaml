MODULE: "Functional Location"

# ─── File locations (relative to project root) ──────────────────────────────
TEMPLATE_PATH:        "Module/Functional_Location/.xlsx"
DATA_STANDARD_PATH:   "Metadata/DataStandard/DataStandardList.xlsx"
DATA_STANDARD_SHEET:  "Functional Location"
MAPPING_PATH:         "Metadata/Mapping/KDS_Meassuring_Point.xlsx"
OUTPUT_PATH:          "Output"
OUTPUT_FILE_NAME:     ".xlsx"

# ─── Ignore configuration ────────────────────────────────────────────────────
CONFIG_IGNORE_FIELD_SHEET: "Config_Ignore_Field"

IGNORE_COLUMN_SUFFIXES:
  - "_SRC"
  - "_DESC"
  - "SOURCE"
  - "REMARK"

  # ─── Jobs ────────────────────────────────────────────────────────────────────
JOBS:
  - NAME:           "Measuring Point (Table) (TH,MM)"
    SHEET_KEYWORD:  "Measuring Point (Table) (TH,MM)"
    DS_TABLE:       
      - "IMPTT"          

    VALIDATIONS:
      - mandatory
      - length

    PRIMARY_KEYS:
      - ["POINT_TGT"]

    FIXED_VALUE_FIELDS:
      - column: "INACT_TGT"
        allowed_values:
          - ""
      
      - column: "INDCT_TGT"
        allowed_values:
          - "X"

      - column: "LVORM_TGT"
        allowed_values:
          - ""

    PROHIBITED_NEWLINE_FIELDS: []
    NON_BLANK_OPTIONAL_FIELDS: []
    NON_BLANK_OPTIONAL_ANY_FIELDS: []
    SAME_SHEET_REFERENCES: []
    CROSS_SHEET_REFERENCES: []

    KDS_REFERENCES:
      - kds_sheet: "THMM_T370P"
        kds_columns:
          - "MPTYP_TGT"
        source_columns:
          - "MPTYP_TGT"

      # เช็คมือ look up POINT_SRC ถ้ามีใน mapping จะใช้ค่า TO-BE FL/EQ มาใส่ใน FLOC_EQ เเต่ถ้า POINT_SRC ไม่มีใน mapping จะใช้ MPOBJ_SRC
      # - kds_sheet: "FL_EQ_List"
      #   kds_columns:
      #     - "FLOC_EQ_MY"
      #   source_columns:
      #     - "FLOC_EQ_TGT"

      - kds_sheet: "Char_List"
        kds_columns:
          - "ATINN_TGT"
        source_columns:
          - "ATINN_TGT"

    KDS_PROHIBITED_REFERENCES: []
    KDS_COMPLETENESS_REFERENCES: []
    START_WITH_FIELDS: []          
    CUSTOM_VALIDATIONS: []




 